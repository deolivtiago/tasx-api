services:
  db:
    container_name: db
    image: postgres:17
    restart: on-failure:3

    env_file:
      - path: ./default.env
      - path: ./.env
        required: false

    network_mode: host

    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    container_name: web
    image: app:latest
    restart: on-failure:3

    pull_policy: build
    build: .

    depends_on:
      - db

    network_mode: host

    env_file:
      - path: ./default.env
      - path: ./.env
        required: false

volumes:
  pg_data:
